services:

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    volumes:
      - postgres_data_admin:/var/lib/postgresql/data
    env_file:
      - .env

  backend:
    container_name: backend
    build: .
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    restart: always
    depends_on:
      postgres:
        condition: service_started

    env_file:
      - .env

  frontend:
    image: ularchik/cert_admin_front
    container_name: front
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: nginx_server
    restart: always
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data_admin:
